<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - VetConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Mascotas</h1>

        <p>
            Busca la información de tu mascota utilizando su número de atención.
        </p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>

        <section>

            <h2>Buscar mascota</h2>

            <form>

                <label for="numeroAtencion">
                    Número de atención
                </label>

                <input
                    type="text"
                    id="numeroAtencion"
                    name="numeroAtencion"
                    placeholder="Ej: 10025"
                >

                <button type="submit">
                    Buscar mascota
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>Desarrollo Web y Móvil 2026</p>
    </footer>

</body>

</html>
